  <script>
    let allData = [];
    const searchInput = document.getElementById('searchBox');
    const explorerEl = document.getElementById('explorerView');
    const headerEl = document.getElementById('siteHeader');
    const splashScreen = document.getElementById('splashScreen');
    const appRoot = document.documentElement;
    let currentExplorerData = [];

    let layoutFrame = null;
    let currentSearchKey = "";
    
    let activeAbortController = new AbortController();
    let initialLoadSearchKey = null;

    const API = "https://server.dh7.adamdh7.org";
    let userSession = JSON.parse(localStorage.getItem('dh7_session')) || null;
    let currentLanguage = localStorage.getItem('language') || localStorage.getItem('userLang') || (navigator.language || navigator.userLanguage || 'ht').split('-')[0];
    if (!['ht', 'fr', 'en', 'es'].includes(currentLanguage)) currentLanguage = 'ht';

    const translations = {
        ht: { subtitle: "Digital HUB 7", "placeholder-tfid": "TFID oswa DH7", "placeholder-password": "Modpas", connect: "LOG IN", register: "KREYE YON KONT", "placeholder-lastname": "Nom", "placeholder-firstname": "Prenom", "placeholder-dh7": "DH7 ID", "placeholder-age": "Laj", "create-account": "JOIN D'H7", "back-to-login": "RETOUNEN", "search": "Rechèch...", "toast-success": "Telechajman reyisi", "toast-open": "Ouvri", "empty-search": "Pa gen rezilta pou rechèch sa a", "error-load": "Erè chajman", "error-upload": "Erè upload" },

        en: { subtitle: "Digital HUB 7", "placeholder-tfid": "TFID or DH7", "placeholder-password": "Password", connect: "LOG IN", register: "CREATE AN ACCOUNT", "placeholder-lastname": "Last Name", "placeholder-firstname": "First Name", "placeholder-dh7": "DH7 ID", "placeholder-age": "Age", "create-account": "JOIN D'H7", "back-to-login": "BACK", "search": "Search...", "toast-success": "Download successful", "toast-open": "Open", "empty-search": "No results found", "error-load": "Loading error", "error-upload": "Upload error" },

    };

    function setAppHeight() {
        const h = window.innerHeight || document.documentElement.clientHeight || 0;
        document.documentElement.style.setProperty('--app-height', h + 'px');
    }

    function setHeaderSpace(px) {
        document.documentElement.style.setProperty('--header-space', Math.max(0, Math.round(px)) + 'px');
    }

    function syncExplorerLayout() {
        if (layoutFrame) cancelAnimationFrame(layoutFrame);
        layoutFrame = requestAnimationFrame(() => {
            if (!headerEl || !explorerEl) return;
            const visible = headerEl.style.display !== 'none' && headerEl.style.transform !== 'translateY(-100%)';
            setHeaderSpace(visible ? headerEl.getBoundingClientRect().height : 0);
        });
    }

    function clearSearchState(restoreList) {
        if (searchDebounceTimer) {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = null;
        }
        const hadSearch = searchActive || searchInput.value.trim() !== '';
        searchInput.value = '';
        searchActive = false;
        currentSearchKey = "";
        if (restoreList && hadSearch) {
            displayExplorer(allData);
            requestAnimationFrame(() => {
                explorerEl.scrollTop = lastSearchScrollTop || 0;
            });
        }
    }

    function markSearchStart() {
        if (!searchActive) {
            lastSearchScrollTop = explorerEl.scrollTop;
        }
        searchActive = true;
    }

    function updateHeaderIcon() {
        const btn = document.getElementById('headerActionBtn');
        if (userSession) {
            btn.innerHTML = `<svg fill="#fff" width="24" height="24" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.08 13.28 4 12.61 4 12s.08-1.28.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.34.16-2h4.68c.09.66.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.18.72.26 1.39.26 2s-.08 1.28-.26 2h-3.38z"/></svg>`;
        } else {
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="#fff" width="24" height="24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
        }
    }

    let lastScrollY = 0;
    explorerEl.addEventListener('scroll', () => {
        const st = explorerEl.scrollTop;
        if (st > lastScrollY + 10 && st > 50) {
            headerEl.style.transform = 'translateY(-100%)';
            setHeaderSpace(0);
        } else if (st < lastScrollY - 10 || st <= 0) {
            headerEl.style.transform = 'translateY(0)';
            setHeaderSpace(headerEl.getBoundingClientRect().height);
        }
        lastScrollY = st;
    });

    function handleRoute() {
        const path = location.pathname;
        const searchPath = location.search;
        let key = null;

        if (path.startsWith('/key=')) {
            key = decodeURIComponent(path.substring(5));
            history.replaceState(null, '', `/?key=${encodeURIComponent(key)}`);
        } else if (searchPath.includes('?key=')) {
            key = new URLSearchParams(searchPath).get('key');
        } else if (path !== '/' && !path.startsWith('/login')) {
            history.replaceState(null, '', '/');
            return handleRoute();
        }

        if (path.includes('/login')) {
            if (userSession) {
                history.replaceState(null, '', '/');
                handleRoute();
            } else {
                document.getElementById('scr-auth').style.display = 'flex';
                document.getElementById('siteHeader').style.display = 'none';
                document.getElementById('explorerView').style.display = 'none';
                setHeaderSpace(0);
            }
        } else {
            document.getElementById('scr-auth').style.display = 'none';
            document.getElementById('siteHeader').style.display = 'flex';
            document.getElementById('explorerView').style.display = 'block';
            requestAnimationFrame(() => setHeaderSpace(headerEl.getBoundingClientRect().height));

            if (key) {
                if (allData.length === 0) {
                    initialLoadSearchKey = key;
                } else {
                    currentSearchKey = key;
                    doSearchFromKey(key);
                }
            } else {
                if(allData.length > 0) displayExplorer(allData);
            }
        }
    }

    function updateURLWithKey(key) {
        if (!key) {
            history.pushState(null, '', '/');
            return;
        }
        history.pushState(null, '', `/?key=${encodeURIComponent(key)}`);
    }

    window.addEventListener('popstate', () => {
        handleRoute();
    });

    document.getElementById('headerActionBtn').addEventListener('click', () => {
        if (userSession) {
            showLangSheet();
        } else {
            history.pushState(null, '', '/login');
            handleRoute();
        }
    });

    async function loginApp() {
        let id = document.getElementById('login-id').value.trim();
        const pass = document.getElementById('login-pass').value;

        if(!id || !pass) return alert(translations[currentLanguage]["error-load"] || "Ranpli tout chan yo");
        if (!id.includes('@dh7.tf') && !id.startsWith('TF-')) id += '@dh7.tf';

        try {
            const res = await fetch(`${API}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: id, password: pass })
            });
            const data = await res.json();

            if(data.success) {
                userSession = data.user;
                localStorage.setItem('dh7_session', JSON.stringify(userSession));
                updateHeaderIcon();
                history.pushState(null, '', '/');
                handleRoute();
            } else { alert(data.error || translations[currentLanguage]["error-load"]); }
        } catch(e) { alert(translations[currentLanguage]["error-load"]); }
    }

    async function registerApp() {
        const nom = document.getElementById('reg-nom').value;
        const prenom = document.getElementById('reg-prenom').value;
        let dh7 = document.getElementById('reg-dh7').value.trim();
        const age = parseInt(document.getElementById('reg-age').value);
        const pass = document.getElementById('reg-pass').value;

        if(!nom || !prenom || !dh7 || !age || !pass) return alert(translations[currentLanguage]["error-load"]);
        if (!dh7.includes('@dh7.tf')) dh7 += '@dh7.tf';

        try {
            const res = await fetch(`${API}/register`, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nom, prenom, dh7, age, password: pass }) 
            });
            const result = await res.json();

            if(result.success) {
                alert(`${result.tfid}`);
                toggleAuth();
            } else { alert(result.error || translations[currentLanguage]["error-load"]); }
        } catch (e) { alert(translations[currentLanguage]["error-load"]); }
    }

    function toggleAuth() {
        document.getElementById('login-form').classList.toggle('hidden-auth');
        document.getElementById('reg-form').classList.toggle('hidden-auth');
    }

    function showLangSheet() {
        document.getElementById('backdrop-sheet').classList.add('show');
        document.getElementById('lang-sheet').classList.add('show');
    }

    function closeOverlays() {
        document.getElementById('backdrop-sheet').classList.remove('show');
        document.getElementById('lang-sheet').classList.remove('show');
    }

    function applyTranslations(lang) {
        const t = translations[lang];
        if(!t) return;
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.dataset.key;
            if (t[key]) {
                if (el.tagName === 'INPUT') el.placeholder = t[key];
                else el.innerText = t[key];
            }
        });
    }

    function changeAppLanguage(lang) {
        currentLanguage = lang;
        localStorage.setItem('language', lang);
        localStorage.setItem('userLang', lang);
        closeOverlays();
        loadLanguageData(lang);
    }

    function preloadImages(data) {
        return new Promise(resolve => {
            const imagesToLoad = data
                .map(p => p["Url Thumb"] || p.Previously || p.image || p.thumb || "")
                .filter(src => src && (src.startsWith('http') || src.startsWith('data:')))
                .slice(0, 7);
            
            if(imagesToLoad.length === 0) return resolve();
            
            let loaded = 0;
            let resolved = false;
            
            const forceResolve = () => {
                if(!resolved){ resolved=true; resolve(); }
            };
            
            imagesToLoad.forEach(src => {
                const img = new Image();
                img.onload = img.onerror = () => {
                    loaded++;
                    if(loaded === imagesToLoad.length) forceResolve();
                };
                img.src = src;
            });
            setTimeout(forceResolve, 4000);
        });
    }

    function loadLanguageData(lang) {
        clearSearchState(false);
        activeAbortController.abort();
        activeAbortController = new AbortController();
        
        splashScreen.style.display = 'flex';
        splashScreen.style.opacity = '1';
        
        fetch("https://adamdh7.org/" + lang + ".json", { signal: activeAbortController.signal })
        .then(res => {
            if(!res.ok) throw new Error("Erreur");
            return res.json();
        })
        .then(data => {
            let combined = Array.isArray(data) ? data : [data];
            shuffle(combined);
            allData = combined.filter(p => {
                const cat = (p.Catégorie || p.Categorie || p.category || "").toString().toLowerCase();
                return cat === "poste";
            });

            preloadImages(allData).then(() => {
                if (initialLoadSearchKey) {
                    doSearchFromKey(initialLoadSearchKey);
                    initialLoadSearchKey = null;
                } else {
                    displayExplorer(allData);
                }
                explorerEl.scrollTop = 0;
                applyTranslations(lang);
                
                splashScreen.style.opacity = '0';
                setTimeout(() => { splashScreen.style.display = 'none'; }, 400);
            });
        })
        .catch(err => {
            if(err.name === 'AbortError') return;
            explorerEl.innerHTML = `<div style="color:#999;padding:20px;text-align:center">${translations[lang]["error-load"]}</div>`;
            syncExplorerLayout();
            splashScreen.style.opacity = '0';
            setTimeout(() => { splashScreen.style.display = 'none'; }, 400);
        });
    }

    function refreshData() {
        activeAbortController.abort();
        activeAbortController = new AbortController();
        showLoader();
        fetch("https://adamdh7.org/" + currentLanguage + ".json", { signal: activeAbortController.signal })
        .then(res => res.json())
        .then(data => {
            let combined = Array.isArray(data) ? data : [data];
            shuffle(combined);
            allData = combined.filter(p => {
                const cat = (p.Catégorie || p.Categorie || p.category || "").toString().toLowerCase();
                return cat === "poste";
            });
            displayExplorer(allData);
            hideLoader();
        }).catch(err => {
            if(err.name !== 'AbortError') hideLoader();
        });
    }

    let currentContainer = null;
    let pendingVideoSrc = null;
    let pendingVideoContainer = null;
    let preloadVideoEl = null;
    
    let prebufferPool = [];

    const overlayEl = document.getElementById('customAdOverlay');
    const adContainer = document.getElementById('ad-container');
    const adMediaWrapper = document.getElementById('ad-media-wrapper');
    const adCloseBtn = document.getElementById('ad-close-btn');
    const adSoundBtn = document.getElementById('ad-sound-btn');
    const adCtaBtn = document.getElementById('ad-cta-btn');
    const adProgressBar = document.getElementById('ad-progress-bar');
    const adProgressContainer = document.getElementById('ad-progress-container');

    const actionOverlay = document.getElementById('actionOverlay');
    const btnDownload = document.getElementById('actDownload');
    const btnClose = document.getElementById('actClose');
    let targetCardForDownload = null;

    const centralLoader = document.getElementById('centralLoader');
    const bottomProgress = document.getElementById('bottomProgress');

    const adTranslations = { ht: "Klike isit la", fr: "Cliquez ici", es: "Haz clic aquí", en: "Click here" };
    const adMutedSVG = '<svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 0 24 24" width="32" fill="white"><path d="M0 0h24v24H0z" fill="none"/><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
    const adUnmutedSVG = '<svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 0 24 24" width="32" fill="white"><path d="M0 0h24v24H0z" fill="none"/><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.73 2.5-2.25 2.5-4.03zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';

    function revertToThumb(container) {
      if (!container) return;
      const video = container.querySelector('video');
      if (video && video.currentTime > 1) {
        container.dataset.savedSrc = video.src;
        container.dataset.savedTime = video.currentTime.toFixed(2);
        setTimeout(() => {
          delete container.dataset.savedSrc;
          delete container.dataset.savedTime;
        }, 27000);
        video.pause();
      }
      const iframe = container.querySelector('iframe');
      if (iframe && iframe.src.includes('youtube.com')) {
        try { iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*'); } catch(e) {}
      }
      const thumbSrc = container.dataset.thumbSrc || "https://via.placeholder.com/800x450?text=Preview";
      container.innerHTML = `<img class="post-thumb" src="${thumbSrc}" alt="" loading="lazy" draggable="false">`;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function showLoader(){
      activeAbortController.abort();
      activeAbortController = new AbortController();
      if (centralLoader) {
        centralLoader.style.display = 'block';
        requestAnimationFrame(() => {
          centralLoader.style.opacity = '1';
        });
      }
    }

    function hideLoader(){
      if (centralLoader) {
        centralLoader.style.opacity = '0';
        setTimeout(() => {
          centralLoader.style.display = 'none';
        }, 220);
      }
    }

    function stopAdMedia() {
      const v = adMediaWrapper.querySelector('video');
      if (v) { v.pause(); v.src = ""; v.load(); }
      adMediaWrapper.innerHTML = '';
    }

    function closeAdOverlay() {
      stopAdMedia();
      overlayEl.style.display = "none";
      if (pendingVideoSrc && pendingVideoContainer) {
        playMedia(pendingVideoSrc, pendingVideoContainer);
      }
      pendingVideoSrc = null;
      pendingVideoContainer = null;
      if (preloadVideoEl) {
        preloadVideoEl.pause();
        preloadVideoEl.src = "";
        preloadVideoEl.remove();
        preloadVideoEl = null;
      }
    }

    function getAdLanguage() {
      return ['ht', 'fr', 'es', 'en'].includes(currentLanguage) ? currentLanguage : 'en';
    }

    async function startAdSequence() {
      overlayEl.style.display = "flex";
      adCloseBtn.style.display = 'none';
      adSoundBtn.style.display = 'none';
      adProgressContainer.style.display = 'none';
      adCtaBtn.style.display = 'none';
      adMediaWrapper.innerHTML = '';
      adCloseBtn.onclick = null;
      adCloseBtn.classList.remove('clickable');

      const lang = getAdLanguage();
      let data = [];
      const baseUrl = "https://pub.adamdh7.org/"; 

      try {
        const response = await fetch(`${baseUrl}${lang}.json`);
        if (!response.ok) throw new Error();
        data = await response.json();
      } catch (e) {
        try {
          const fallbackResponse = await fetch(`${baseUrl}en.json`);
          if (!fallbackResponse.ok) throw new Error();
          data = await fallbackResponse.json();
        } catch (err) {
          closeAdOverlay();
          return;
        }
      }

      if (data && data.length > 0) {
        const item = data[Math.floor(Math.random() * data.length)];
        if (!item.url || item.url.trim() === "") {
            closeAdOverlay();
            return;
        }
        renderAdContent(item, lang);
      } else {
        closeAdOverlay();
      }
    }

    function renderAdContent(item, lang) {
      if (item.link) {
        adCtaBtn.href = item.link;
        adCtaBtn.textContent = adTranslations[lang] || adTranslations['en'];
      } else {
        adCtaBtn.removeAttribute('href');
      }

      const videoExtensions = ['.mp4','.mov','.mkv','.webm','.avi','.ogg','.flv','.wmv','.3gp','.m4v','.mpg','.mpeg'];
      const isVideo = item.type === 'video' || videoExtensions.some(ext => item.url.toLowerCase().endsWith(ext));

      if (isVideo) setupAdVideo(item);
      else setupAdImage(item);
    }

    function showAdOverlays(isVideo) {
      adCloseBtn.style.display = 'flex';
      adSoundBtn.style.display = isVideo ? 'flex' : 'none';
      if (adCtaBtn.hasAttribute('href') && adCtaBtn.getAttribute('href') !== '#') {
        adCtaBtn.style.display = 'block';
      }
      adProgressContainer.style.display = isVideo ? 'block' : 'none';
    }

    function setupAdVideo(item) {
      const video = document.createElement('video');
      video.src = item.url;
      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;
      video.controls = false;
      video.preload = 'auto';

      video.onerror = () => closeAdOverlay();

      adMediaWrapper.appendChild(video);

      function updateSoundIcon() { adSoundBtn.innerHTML = video.muted ? adMutedSVG : adUnmutedSVG; }
      updateSoundIcon();

      let overlaysShown = false;
      video.addEventListener('playing', () => {
        if (!overlaysShown) {
          showAdOverlays(true);
          updateSoundIcon();
          if (video.duration && !isNaN(video.duration)) {
            const initialTimeLeft = Math.ceil(video.duration - video.currentTime);
            adCloseBtn.innerText = initialTimeLeft + "s";
          }
          overlaysShown = true;
        }
      });

      video.ontimeupdate = () => {
        const percent = video.duration ? (video.currentTime / video.duration) * 100 : 0;

    function looksLikeVideo(src){
      if (!src) return false;
      try {
        const url = src.toString().split('?')[0].toLowerCase();
        if (/\.(mp4|webm|ogg|mov|mkv)$/.test(url)) return true;
        if (src.includes("youtube.com") || src.includes("youtu.be") || src.includes("vimeo.com")) return true;
      } catch(e){}
      return false;
    }

    function normalizeYouTubeEmbed(src){
      try {
        if (src.includes("youtu.be/")) {
          const id = src.split("youtu.be/")[1].split(/[?&]/)[0];
          return "https://www.youtube.com/embed/" + id + "?autoplay=1&rel=0";
        }
        const u = new URL(src);
        const vParam = u.searchParams.get('v');
        if (vParam) return "https://www.youtube.com/embed/" + vParam + "?autoplay=1&rel=0";
      } catch(e){}
      return src;
    }

    function normalizeVimeoEmbed(src){
      try {
        const parts = src.split('/');
        const id = parts.pop() || parts.pop();
        return "https://player.vimeo.com/video/" + id + "?autoplay=1";
      } catch(e){}
      return src;
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      const total = Math.floor(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      const mm = String(minutes).padStart(2, "0");
      const ss = String(secs).padStart(2, "0");
      if (hours > 0) return `${hours}:${mm}:${ss}`;
      return `${minutes}:${ss}`;
    }

          let hideTimer = null;

          const setCenterLoading = (loading) => {

            centerDiv.classList.toggle("loading", loading);
            if (loading) {
              controls.classList.remove("hidden");
            }
          };

          const showControls = () => {
            controls.classList.remove("hidden");
            clearTimeout(hideTimer);
            if (!video.paused && !isLoading) {
              hideTimer = setTimeout(() => controls.classList.add("hidden"), 4000);
            }
          };

          const syncPlayState = () => {
            playBtn.innerHTML = video.paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
          };

          const onLoadingStart = () => {

          player.addEventListener("click", (e) => {
            if (e.target.closest('button') || e.target.closest('.progress-container')) return;

            group.style.display = "flex";

          video.addEventListener("loadstart", onLoadingStart);

          video.addEventListener("timeupdate", () => {
            currentTime.textContent = formatTime(video.currentTime);
            durationTime.textContent = formatTime(video.duration || 0);

            progressFill.style.width = percent + "%";

          video.addEventListener("loadedmetadata", () => {
            player.classList.add('loaded-ratio');
            const savedTime = parseFloat(container.dataset.savedTime || "0");
            const savedSrc = container.dataset.savedSrc || "";
            if (savedTime > 0 && video.src === savedSrc) {
              video.currentTime = savedTime;
              delete container.dataset.savedTime;
              delete container.dataset.savedSrc;
            }
            currentTime.textContent = formatTime(video.currentTime || 0);
            durationTime.textContent = formatTime(video.duration || 0);
            syncPlayState();
          });

          const scrub = (e) => {
            const rect = progressCont.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let pos = (clientX - rect.left) / rect.width;
            pos = Math.max(0, Math.min(1, pos));
            if (Number.isFinite(video.duration) && video.duration > 0) {
              video.currentTime = pos * video.duration;

            const percent = pos * 100;

          fsBtn.addEventListener("click", async (e) => {

            el.addEventListener("click", (e) => e.stopPropagation());
            el.addEventListener("touchstart", (e) => e.stopPropagation(), {passive: true});
          });

          onLoadingStart();
          if (video.readyState >= 3) {

    function uploadWithRetry(formData, maxRetries = 3) {
      return new Promise((resolve, reject) => {
          let resolved = false;
          let pending = maxRetries;
          for(let i=0; i<maxRetries; i++) {
              fetch('https://v1bref.onrender.com/upload', {
                  method: 'POST',
                  body: formData
              }).then(res => res.text()).then(txt => {
                  if(!resolved) {
                      resolved = true;
                      resolve(txt);
                  }
              }).catch(err => {
                  pending--;
                  if(pending === 0 && !resolved) reject(err);
              });
          }
      });
    }

    function processDownload(card) {
      if (!card || typeof html2canvas === 'undefined') return;

      const nameEl = card.querySelector('.post-name');
      let postName = nameEl ? nameEl.textContent.trim() : 'Post';
      postName = postName.replace(/[\/:*?"<>|]/g, '_');
      const safeName = postName + '.png';

      const thumbCon = card.querySelector('.post-thumb-container');
      if (thumbCon) {
        const videoEl = thumbCon.querySelector('video');
        if (videoEl && videoEl.src && looksLikeVideo(videoEl.src)) {
          window.open(videoEl.src, '_blank');
          return;
        }
      }

      const popupState = prepareDownloadPopup();
      const { popup, ring, percentTxt, successIcon, openBtn, statusTxt } = popupState;
      let fakeProgress = 0;
      let fakeInterval = setInterval(() => {
          if(fakeProgress < 90) {
              fakeProgress += Math.floor(Math.random()*4)+1;
              if(fakeProgress>90) fakeProgress=90;
              statusTxt.textContent = fakeProgress + "%";
              percentTxt.textContent = fakeProgress + "%";
          }
      }, 100);

      html2canvas(card, {
        scale: 3,
        useCORS: true,
        backgroundColor: '#111',
        logging: false
      }).then(canvas => {
        canvas.toBlob(blob => {
            const formData = new FormData();
            formData.append('file', blob, safeName);
            
            uploadWithRetry(formData, 3).then(txt => {
                clearInterval(fakeInterval);
                statusTxt.textContent = "100%";
                percentTxt.textContent = "100%";
                let finalUrl = txt;
                try {
                    const json = JSON.parse(txt);
                    if(json.url) finalUrl = json.url;
                } catch(e){}

                setTimeout(() => {
                    ring.style.display = 'none';
                    percentTxt.style.display = 'none';
                    successIcon.style.display = 'flex';
                    successIcon.style.background = '#333333';
                    const successSvg = successIcon.querySelector('svg');
                    if (successSvg) successSvg.style.fill = '#b7b7b7';
                    statusTxt.textContent = translations[currentLanguage] ? translations[currentLanguage]["toast-success"] : "Terminé";
                    statusTxt.style.display = 'none';
                    openBtn.style.display = 'block';

                    openBtn.onclick = () => {
                        popup.classList.remove('show');
                        const a = document.createElement('a');
                        a.href = finalUrl;
                        a.target = '_blank';
                        a.setAttribute('data-bypass', 'true');
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    };
                    setTimeout(() => popup.classList.remove('show'), 6000);
                }, 0);
            }).catch(err => {
                clearInterval(fakeInterval);
                popup.classList.remove('show');
                alert(translations[currentLanguage] ? translations[currentLanguage]["error-upload"] : "Erreur");
            });
        }, 'image/png');
      }).catch(err => {
        clearInterval(fakeInterval);
        popup.classList.remove('show');
        if (thumbCon) {
          const thumbImg = thumbCon.querySelector('img');
          if (thumbImg) window.open(thumbImg.src, '_blank');
        }
      });
    }

    let pullStartY = 0;
    let isPulling = false;

    document.addEventListener('touchstart', (e) => {
      if (explorerEl.scrollTop <= 0) { pullStartY = e.touches[0].clientY; isPulling = true; } 
      else isPulling = false;
    }, {passive: false});

    document.addEventListener('touchmove', (e) => {
      if (!isPulling) return;
      const y = e.touches[0].clientY;
      const diff = y - pullStartY;
      
      if (diff > 0 && explorerEl.scrollTop <= 0) {
        if(e.cancelable) e.preventDefault();
        if (diff > 50) { 
          centralLoader.style.display = 'block'; 
          centralLoader.style.opacity = Math.min(1, diff / 200); 
        }
      }
    }, {passive: false});

    document.addEventListener('touchend', (e) => {
      if (!isPulling) return;
      const y = e.changedTouches[0].clientY;
      const diff = y - pullStartY;
      
      if (diff > 150 && explorerEl.scrollTop <= 0) {
        document.getElementById('searchBox').value = '';
        clearSearchState(true);
        refreshData();
      } else {
        if(centralLoader && centralLoader.style.display === 'block') {
             centralLoader.style.opacity = '0';
             setTimeout(() => centralLoader.style.display = 'none', 300);
        }
      }
      isPulling = false;
    });

    document.addEventListener('DOMContentLoaded', () => {
      setAppHeight();
      updateHeaderIcon();
      handleRoute();
      syncExplorerLayout();
      window.addEventListener('resize', () => {
        setAppHeight();
        syncExplorerLayout();
      }, { passive: true });
      window.addEventListener('orientationchange', () => {
        setAppHeight();
        syncExplorerLayout();
      }, { passive: true });
      if (!location.pathname.includes('/login') || userSession) {
          loadLanguageData(currentLanguage);
      }
    });
  </script>

              caches.keys().then(function(names) { for (let name of names) caches.delete(name); });

            }
            reg.onupdatefound = () => {
              const newSW = reg.installing;
              newSW.addEventListener('statechange', () => {
                if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                    caches.keys().then(function(names) { for (let name of names) caches.delete(name); });
                    newSW.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            };
          })
          .catch(err => console.warn('SW register failed:', err));

    }
