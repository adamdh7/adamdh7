    function handleRoute() {
        let path = location.pathname;
        let searchPath = location.search;

        if (/%3C|%3E|<|>/i.test(location.href)) {

            path = '/';
            searchPath = '';
        }

        let key = null;
        tempLang = null;

        const matchLangKey = path.match(/^\/(fr|es|en|ht)\/key=(.*)$/);
        const matchLangQueryKey = path.match(/^\/(fr|es|en|ht)\/?\?key=(.*)$/);
        
        if (matchLangKey) {

            key = decodeURIComponent(matchLangKey[2]);
            history.replaceState(null, '', `/${tempLang}/key=${encodeURIComponent(key)}`);

            tempLang = matchLangQueryKey[1];
            key = decodeURIComponent(matchLangQueryKey[2]);

        toast.innerText = text;
        
        const removeToast = () => {
            if(toast.timeoutId) clearTimeout(toast.timeoutId);
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(20px)';
            toast.style.transition = 'all 0.2s ease';
            setTimeout(() => {
                if(toast.parentNode) toast.parentNode.removeChild(toast);
            }, 200);
        };

        toast.onclick = removeToast;

        container.appendChild(toast);
        while (container.children.length > 2) {
            const first = container.firstChild;
            if(first.timeoutId) clearTimeout(first.timeoutId);
            container.removeChild(first);
        }
        
        toast.timeoutId = setTimeout(() => {
            removeToast();
        }, 3500);
    }

    function setupModalDrag(modalId) {
        const modal = document.getElementById(modalId);
        const handle = modal.querySelector('.swipe-handle-area');
        let startY = 0;
        let currentY = 0;
        let dragging = false;
        let startTime = 0;

        const applyDrag = (clientY) => {
            currentY = clientY;
            const deltaY = currentY - startY;
            modal.style.transition = 'none';
            if (deltaY >= 0) {
                modal.style.transform = `translateY(${deltaY}px)`;
            } else {
                modal.style.transform = `translateY(0px)`;
            }
        };

        handle.addEventListener('touchstart', (e) => {
            if (!e.touches || !e.touches[0]) return;
            startY = e.touches[0].clientY;
            currentY = startY;
            dragging = true;
            startTime = Date.now();
            modal.style.transition = 'none';
        }, { passive: true });

        handle.addEventListener('touchmove', (e) => {
            if (!dragging || !e.touches || !e.touches[0]) return;
            applyDrag(e.touches[0].clientY);
        }, { passive: true });

        handle.addEventListener('touchend', () => {
            if (!dragging) return;
            dragging = false;
            const deltaY = currentY - startY;
            const elapsed = Math.max(1, Date.now() - startTime);
            const velocity = deltaY / elapsed;
            modal.style.transition = 'transform 0.28s ease';

            if (deltaY > 80 || velocity > 0.45) {
                modal.style.transform = 'translateY(100%)';
                setTimeout(() => {
                    modal.classList.remove('show');
                    modal.style.transform = '';
                    closeOverlays();
                }, 120);
            } else {
                modal.style.transform = 'translateY(0)';
            }
        }, { passive: true });
    }

    function preloadImages(data) {
        return new Promise(resolve => {
            const imagesToLoad = data
                .map(p => p["Url Thumb"] || p.Previously || p.image || p.thumb || "")
                .filter(src => src && (src.startsWith('http') || src.startsWith('data:')))
                .slice(0, 7);
            
            if(imagesToLoad.length === 0) return resolve();
            
            let loaded = 0;
            let resolved = false;
            
            const forceResolve = () => {
                if(!resolved){ resolved=true; resolve(); }
            };
            
            imagesToLoad.forEach(src => {
                const img = new Image();
                img.onload = img.onerror = () => {
                    loaded++;
                    if(loaded === imagesToLoad.length) forceResolve();
                };
                img.src = src;
            });
            setTimeout(forceResolve, 4000);
        });
    }

            }
        }, 1500);
        
        fetchServerData(lang, activeAbortController.signal)

            clearTimeout(backupLoaderTimeout);
            allData = [];
            explorerEl.innerHTML = '';
            renderEmptyState(translations[lang] ? translations[lang]["error-load"] : "Erreur", 'error');

    function renderAdContent(item) {
      const lang = getActiveLang();
      if (item.link) {
        adCtaBtn.href = item.link;
        adCtaBtn.textContent = translations[lang] ? translations[lang]["ad-click"] : "Click here";
        adCtaBtn.setAttribute('data-bypass', 'true');

        adCtaBtn.setAttribute('rel', 'noopener noreferrer');
      } else {
        adCtaBtn.removeAttribute('href');
        adCtaBtn.removeAttribute('target');
        adCtaBtn.removeAttribute('rel');
      }

      const videoExtensions = ['.mp4','.mov','.mkv','.webm','.avi','.ogg','.flv','.wmv','.3gp','.m4v','.mpg','.mpeg'];
      const isVideo = item.type === 'video' || videoExtensions.some(ext => item.url.toLowerCase().endsWith(ext));

      if (isVideo) setupAdVideo(item);
      else setupAdImage(item);

    function setupAdVideo(item) {
      const video = document.createElement('video');
      video.src = item.url;
      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;
      video.controls = false;
      video.preload = 'auto';

      video.onerror = () => {
          stopAdMedia();
          renderAdContent(getFallbackAdItem());
      };

      adMediaWrapper.appendChild(video);

      function updateSoundIcon() { adSoundBtn.innerHTML = video.muted ? adMutedSVG : adUnmutedSVG; }
      updateSoundIcon();

      let overlaysShown = false;
      video.addEventListener('playing', () => {
        if (!overlaysShown) {
          showAdOverlays(true);
          updateSoundIcon();
          if (video.duration) adCloseBtn.innerText = Math.ceil(video.duration - video.currentTime);
          overlaysShown = true;
        }
      });

      video.ontimeupdate = () => {
        adProgressBar.style.width = (video.duration ? (video.currentTime / video.duration) * 100 : 0) + "%";
        const timeLeft = video.duration ? Math.ceil(video.duration - video.currentTime) : 0;
        if (timeLeft > 0) adCloseBtn.innerText = timeLeft;
      };

      video.onended = () => {
        activateAdCloseButton();
        adProgressBar.style.width = "100%";
      };

      video.play().catch(() => {});

      const unlockAudio = () => {
        video.muted = false;
        video.play().catch(() => {});
        updateSoundIcon();
        adContainer.removeEventListener('click', unlockAudio);
        adContainer.removeEventListener('touchstart', unlockAudio);
      };

      adContainer.addEventListener('click', unlockAudio);
      adContainer.addEventListener('touchstart', unlockAudio);

      adSoundBtn.onclick = (e) => {
        e.stopPropagation();
        video.muted = !video.muted;
        if (!video.muted) video.play().catch(() => {});
        updateSoundIcon();
      };
    }

    function generateTFID(post, index) {
        const str = (post.Name || '') + (post.Bio || '') + (post.Description || '');
        let hash = 0;
        for (let i = 0; i < str.length; i++) hash = Math.imul(31, hash) + str.charCodeAt(i) | 0;
        return 'tfid_' + Math.abs(hash).toString(36) + '_' + index;
    }

    function buildCardsFragment(data){
      const frag = document.createDocumentFragment();

        card.className = "post-card";
        const safeName = (post.Name || 'Post').replace(/[\/:*?"<>|]/g, '_') + '.png';
        const tfid = generateTFID(post, i);
        card.dataset.safeName = safeName;
        card.dataset.tfid = tfid;

        const title = document.createElement("div");

    function initScrollObserver() {
        if(!scrollObserver) {
            scrollObserver = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting) renderNextChunk();
            }, { root: document.getElementById('explorerView'), rootMargin: '300px' });
        }
    }

    function displayExplorer(data) {
      currentExplorerData = Array.isArray(data) ? data.slice() : [];
      currentRenderData = currentExplorerData.slice();
      explorerEl.innerHTML = "";
      renderIndex = 0;
      initScrollObserver();
      renderNextChunk();
      showHeader();
      syncExplorerLayout();
      
      setTimeout(() => {
          if (explorerEl.scrollHeight <= explorerEl.clientHeight + 50) {
              showHeader();
          }
      }, 100);
    }

    function renderNextChunk() {
        if (renderIndex >= currentRenderData.length) {
            const sentinel = document.getElementById('scrollSentinel');
            if (sentinel && scrollObserver) scrollObserver.unobserve(sentinel);
            return;
        }
        const chunk = currentRenderData.slice(renderIndex, renderIndex + RENDER_CHUNK);
        const frag = buildCardsFragment(chunk);
        
        let sentinel = document.getElementById('scrollSentinel');
        if (sentinel) {
            if(scrollObserver) scrollObserver.unobserve(sentinel);
            sentinel.remove();
        }
        
        const existingLinks = document.querySelector('.social-section');
        if(existingLinks) existingLinks.remove();

        explorerEl.appendChild(frag);
        renderIndex += RENDER_CHUNK;

        if (renderIndex < currentRenderData.length) {
            sentinel = document.createElement('div');
            sentinel.id = 'scrollSentinel';
            sentinel.style.height = '1px';
            explorerEl.appendChild(sentinel);
            if(scrollObserver) scrollObserver.observe(sentinel);
        }
        
        displaySocialLinks();

        setTimeout(() => {
            if (explorerEl.scrollHeight <= explorerEl.clientHeight + 50) {
                showHeader();
            }
        }, 100);
    }

    function looksLikeVideo(src){
      if (!src) return false;
      try {
        const url = src.toString().split('?')[0].toLowerCase();
        if (/\.(mp4|webm|ogg|mov|mkv)$/.test(url)) return true;
        if (src.includes("youtube.com") || src.includes("youtu.be") || src.includes("vimeo.com")) return true;
      } catch(e){}
      return false;
    }

    function normalizeYouTubeEmbed(src){
      try {
        if (src.includes("youtu.be/")) {
          const id = src.split("youtu.be/")[1].split(/[?&]/)[0];
          return "https://www.youtube.com/embed/" + id + "?autoplay=1&rel=0";
        }
        const u = new URL(src);
        const vParam = u.searchParams.get('v');
        if (vParam) return "https://www.youtube.com/embed/" + vParam + "?autoplay=1&rel=0";
      } catch(e){}
      return src;
    }

    function normalizeVimeoEmbed(src){
      try {
        const parts = src.split('/');
        const id = parts.pop() || parts.pop();
        return "https://player.vimeo.com/video/" + id + "?autoplay=1";
      } catch(e){}
      return src;
    }

      function startLandscapeGesture(clientX, clientY){
        if(!isFullscreenCard()) return;
        unmuteVideo();
        const rect = player.getBoundingClientRect();

        const limit = rect.width * cornerRatio;

          const initial = match ? parseFloat(match[1]) : 1;
          gesture = { type:'brightness', startY:clientY, initialValue: isNaN(initial) ? 1 : initial };
          showSwipeIndicator('brightness', Math.round(gesture.initialValue * 100));
        } else if(relX >= (rect.width - limit)){
          gesture = { type:'volume', startY:clientY, initialValue: video.volume };
          showSwipeIndicator('volume', Math.round(gesture.initialValue * 100));
        } else { gesture = null; }
      }

      function moveLandscapeGesture(clientY){
        if(!gesture) return;
        const rect = player.getBoundingClientRect();
        const delta = (gesture.startY - clientY);
        const pct = delta / (rect.height * 0.7);
        let newVal = gesture.initialValue + pct;
        newVal = clamp(newVal, 0, 1);
        if(gesture.type === 'brightness'){
          const applied = Math.max(0.05, newVal);
          video.style.filter = 'brightness(' + applied + ')';
          showSwipeIndicator('brightness', Math.round(applied * 100));
        } else {
          video.volume = newVal;
          showSwipeIndicator('volume', Math.round(newVal * 100));
        }
      }

      function endLandscapeGesture(){
        if(!gesture) return;
        gesture = null;
      }

      player.addEventListener('touchstart', (e)=>{
        unmuteVideo();
        const t = e.touches[0];
        startTouchX = t.clientX;
        startTouchY = t.clientY;
        isVerticalSwipe = false;
        swipeDirectionDetermined = false;
      }, {passive:true});

      player.addEventListener('touchmove', (e)=>{
        if (!e.touches.length) return;
        const t = e.touches[0];
        const diffX = t.clientX - startTouchX;
        const diffY = t.clientY - startTouchY;

        if (!swipeDirectionDetermined) {
          if (Math.abs(diffY) > 10 || Math.abs(diffX) > 10) {
            swipeDirectionDetermined = true;
            if (Math.abs(diffY) > Math.abs(diffX)) {
              isVerticalSwipe = true;
              startLandscapeGesture(startTouchX, startTouchY);
            }
          }
        }

        if (isVerticalSwipe) {
          if (e.cancelable) e.preventDefault();
          moveLandscapeGesture(t.clientY);
        }
      }, {passive:false});

      player.addEventListener('touchend', ()=>{
        endLandscapeGesture();
      }, {passive:true});

    function uploadWithXHR(blob, filename, onProgress) {
        return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://v1bref.onrender.com/upload');
            const formData = new FormData();
            formData.append('file', blob, filename);
            xhr.upload.onprogress = (e) => {
                if(e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
            };
            xhr.onload = () => {
                if(xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText);
                else reject(xhr.statusText);
            };
            xhr.onerror = () => reject("Network Error");
            xhr.send(formData);
        });
    }

    async function imageSourceToBase64(src) {
        try {
            if (!src) return null;
            if (src.startsWith('data:') || src.startsWith('blob:')) return src;
            const res = await fetch(src, { mode: 'cors' });
            const blob = await res.blob();
            return await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        } catch (e) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || img.width || 1;
                    canvas.height = img.naturalHeight || img.height || 1;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    try { resolve(canvas.toDataURL('image/png')); }
                    catch(err) { resolve(null); }
                };
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }
    }

    async function prepareCardCloneForCapture(card) {
        const clone = card.cloneNode(true);
        const imgs = Array.from(clone.querySelectorAll('img'));
        for (const img of imgs) {
            img.style.display = 'block';
            img.style.opacity = '1';
            const src = img.currentSrc || img.src || '';
            const base64 = await imageSourceToBase64(src);
            if (base64) {
                img.src = base64;
                img.removeAttribute('srcset');
                img.removeAttribute('sizes');
                img.crossOrigin = 'anonymous';
            }
        }
        clone.style.margin = '0';
        clone.style.transform = 'none';
        return clone;
    }

    function waitForAllImages(root) {
        const imgs = Array.from(root.querySelectorAll('img'));
        return Promise.all(imgs.map(img => {
            if (img.complete && img.naturalWidth > 0) return Promise.resolve();
            return new Promise(resolve => {
                const done = () => resolve();
                img.addEventListener('load', done, { once: true });
                img.addEventListener('error', done, { once: true });
            });
        }));
    }

    async function processDownload(card) {
      if (!card || typeof html2canvas === 'undefined') return;

      const tfid = card.dataset.tfid;
      const safeName = card.dataset.safeName;

      if (activeDownloads[tfid] && activeDownloads[tfid].status !== 'idle') return;

      const thumbCon = card.querySelector('.post-thumb-container');
      if (thumbCon) {
        const videoEl = thumbCon.querySelector('video');
        if (videoEl && videoEl.src && looksLikeVideo(videoEl.src)) {
          window.open(videoEl.src, '_blank');
          closeOverlays();
          return;
        }
      }

      activeDownloads[tfid] = { progress: 0, status: 'init', url: null };
      syncDownloadUI(tfid);

      const captureContainer = document.createElement('div');
      captureContainer.style.position = 'fixed';
      captureContainer.style.left = '-10000px';
      captureContainer.style.top = '0';
      captureContainer.style.zIndex = '-9999';
      document.body.appendChild(captureContainer);

      try {
          const captureNode = await prepareCardCloneForCapture(card);
          const bounds = card.getBoundingClientRect();
          captureNode.style.width = Math.ceil(bounds.width) + 'px';
          captureNode.style.maxWidth = Math.ceil(bounds.width) + 'px';
          captureNode.style.opacity = '1';
          captureNode.style.position = 'relative';
          captureNode.style.left = '0';
          captureNode.style.top = '0';
          captureNode.style.background = '#121212';
          
          captureContainer.appendChild(captureNode);

          await waitForAllImages(captureNode);

          activeDownloads[tfid].status = 'downloading';
          activeDownloads[tfid].progress = 10;
          syncDownloadUI(tfid);

          const canvasPromise = html2canvas(captureNode, {
            scale: 2,
            useCORS: true,
            allowTaint: false,
            backgroundColor: '#121212',
            logging: false,
            imageTimeout: 5000,
            removeContainer: true,
            scrollX: 0,
            scrollY: 0
          });

          const timeoutPromise = new Promise((_, reject) => {
              setTimeout(() => reject(new Error('timeout')), 7000);
          });

          const canvas = await Promise.race([canvasPromise, timeoutPromise]);
          
          activeDownloads[tfid].progress = 50;
          syncDownloadUI(tfid);

          await new Promise((resolve, reject) => {
              canvas.toBlob(blob => {
                  if (!blob) return reject(new Error('blob'));
                  uploadWithXHR(blob, safeName, (percent) => {
                      const finalProgress = 50 + Math.round((percent / 100) * 50);
                      if (activeDownloads[tfid]) {
                          activeDownloads[tfid].progress = finalProgress;
                          syncDownloadUI(tfid);
                      }
                  }).then(txt => {
                      let url = txt;
                      try {
                          url = JSON.parse(txt).url || txt;
                      } catch(e){}
                      activeDownloads[tfid] = { progress: 100, status: 'done', url: url };
                      syncDownloadUI(tfid);
                      resolve();
                  }).catch(reject);
              }, 'image/png', 1);
          });

          captureContainer.remove();
      } catch (err) {
          const lang = getActiveLang();
          if (targetCardForDownload && targetCardForDownload.dataset.tfid === tfid) {
              showBottomToast(translations[lang]?.["capture-error"] || "Capture error");
          }
          try {
              if (thumbCon) {
                  const thumbImg = thumbCon.querySelector('img');
                  const thumbSrc = thumbImg ? (thumbImg.currentSrc || thumbImg.src || thumbCon.dataset.thumbSrc || '') : (thumbCon.dataset.thumbSrc || '');
                  if (thumbSrc) {
                      const fallbackBase64 = await imageSourceToBase64(thumbSrc);
                      const fallbackBlob = fallbackBase64 ? await (await fetch(fallbackBase64)).blob() : await (await fetch(thumbSrc)).blob();
                      
                      activeDownloads[tfid].status = 'downloading';
                      syncDownloadUI(tfid);

                      await new Promise((resolve, reject) => {
                          uploadWithXHR(fallbackBlob, safeName, (percent) => {
                              if (activeDownloads[tfid]) {
                                  activeDownloads[tfid].progress = percent;
                                  syncDownloadUI(tfid);
                              }
                          }).then(txt => {
                              let url = txt;
                              try { url = JSON.parse(txt).url || txt; } catch(e){}
                              activeDownloads[tfid] = { progress: 100, status: 'done', url: url };
                              syncDownloadUI(tfid);
                              resolve();
                          }).catch(reject);
                      });
                      captureContainer.remove();
                      return;
                  }
              }
          } catch (fallbackErr) {}
          captureContainer.remove();
          delete activeDownloads[tfid];
          if (targetCardForDownload && targetCardForDownload.dataset.tfid === tfid) closeOverlays();
      }
    }
