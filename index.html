    function revertToThumb(container) {
      if (!container) return;

      const video = container.querySelector('video');
      if (video && video.currentTime > 1) {
        container.dataset.savedSrc = video.src;
        container.dataset.savedTime = video.currentTime.toFixed(2);
        setTimeout(() => {
          delete container.dataset.savedSrc;
          delete container.dataset.savedTime;
        }, 27000);
        video.pause();
      }

      const iframe = container.querySelector('iframe');
      if (iframe && iframe.src.includes('youtube.com')) {
        try {
          iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');

    function simulateProgress(onComplete) {
      if (progressInterval) clearInterval(progressInterval);
      bottomProgress.style.display = 'block';
      bottomProgress.style.opacity = '1';
      bottomProgress.innerHTML = '0%';
      let percent = 0;
      
      progressInterval = setInterval(() => {
        if (percent < 90) {
          percent += Math.floor(Math.random() * 5) + 1;
          if(percent > 90) percent = 90;
          bottomProgress.innerHTML = percent + '%';
        }
      }, 50);

      return {
        complete: () => {
          clearInterval(progressInterval);
          bottomProgress.innerHTML = '100%';
          setTimeout(() => {
            bottomProgress.innerHTML = '<svg viewBox="0 0 50 50"><path d="M10 25 L20 35 L40 15"></path></svg>';
            bottomProgress.onclick = () => {
              bottomProgress.style.opacity = '0';
              setTimeout(() => { bottomProgress.style.display = 'none'; }, 500);
            };
            setTimeout(() => {
              bottomProgress.style.opacity = '0';
              setTimeout(() => { 
                  bottomProgress.style.display = 'none';
                  if(onComplete) onComplete();
              }, 500);
            }, 1200);
          }, 200);
        }
      };
    }

    function getAdLanguage() {
      const userLang = navigator.language || navigator.userLanguage;

    async function startAdSequence() {
      overlayEl.style.display = "flex";
      adCloseBtn.style.display = 'none';
      adSoundBtn.style.display = 'none';
      adProgressContainer.style.display = 'none';
      adCtaBtn.style.display = 'none';
      adMediaWrapper.innerHTML = '';
      adCloseBtn.onclick = null;
      adCloseBtn.classList.remove('clickable');

      const lang = getAdLanguage();
      let data = [];
      const baseUrl = "https://pub.adamdh7.org/"; 

      try {
        const response = await fetch(`${baseUrl}${lang}.json`);
        if (!response.ok) throw new Error();
        data = await response.json();
      } catch (e) {
        try {
          const fallbackResponse = await fetch(`${baseUrl}en.json`);
          if (!fallbackResponse.ok) throw new Error();
          data = await fallbackResponse.json();
        } catch (err) {
          closeAdOverlay();
          return;
        }
      }

      if (data && data.length > 0) {
        const item = data[Math.floor(Math.random() * data.length)];
        if (!item.url || item.url.trim() === "") {
            closeAdOverlay();
            return;
        }
        renderAdContent(item, lang);
      } else {
        closeAdOverlay();
      }
    }

    function renderAdContent(item, lang) {
      if (item.link) {
        adCtaBtn.href = item.link;
        adCtaBtn.textContent = adTranslations[lang] || adTranslations['en'];
      } else {
        adCtaBtn.removeAttribute('href');
      }

      const videoExtensions = ['.mp4','.mov','.mkv','.webm','.avi','.ogg','.flv','.wmv','.3gp','.m4v','.mpg','.mpeg'];
      const isVideo = item.type === 'video' || videoExtensions.some(ext => item.url.toLowerCase().endsWith(ext));

      if (isVideo) {
        setupAdVideo(item);
      } else {
        setupAdImage(item);
      }
    }

    function setupAdVideo(item) {
      const video = document.createElement('video');
      video.src = item.url;
      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;
      video.controls = false;
      video.preload = 'auto';

      video.onerror = () => {
          closeAdOverlay();
      };

      adMediaWrapper.appendChild(video);

      function updateSoundIcon() {
        adSoundBtn.innerHTML = video.muted ? adMutedSVG : adUnmutedSVG;
      }
      updateSoundIcon();

      let overlaysShown = false;

      video.addEventListener('playing', () => {
        if (!overlaysShown) {
          showAdOverlays(true);
          updateSoundIcon();
          if (video.duration && !isNaN(video.duration)) {
            const initialTimeLeft = Math.ceil(video.duration - video.currentTime);
            adCloseBtn.innerText = initialTimeLeft + "s";
          }
          overlaysShown = true;
        }
      });

      video.ontimeupdate = () => {
        const percent = video.duration ? (video.currentTime / video.duration) * 100 : 0;
        adProgressBar.style.width = percent + "%";
        const timeLeft = video.duration ? Math.ceil(video.duration - video.currentTime) : 0;
        if (timeLeft > 0) {
          adCloseBtn.innerText = timeLeft + "s";
        }
      };

      video.onended = () => {
        activateAdCloseButton();
        adProgressBar.style.width = "100%";
      };

      video.play().catch(() => {});

      const unlockAudio = () => {
        video.muted = false;
        video.play().catch(() => {});
        updateSoundIcon();
        adContainer.removeEventListener('click', unlockAudio);
        adContainer.removeEventListener('touchstart', unlockAudio);
      };

      adContainer.addEventListener('click', unlockAudio);
      adContainer.addEventListener('touchstart', unlockAudio);

      adSoundBtn.onclick = (e) => {
        e.stopPropagation();
        video.muted = !video.muted;

        updateSoundIcon();
      };

      const shrinkStart = () => adContainer.classList.add('shrink');
      const shrinkEnd = () => adContainer.classList.remove('shrink');
      video.addEventListener('mousedown', shrinkStart);
      video.addEventListener('mouseup', shrinkEnd);

      video.addEventListener('touchend', shrinkEnd);

    function looksLikeVideo(src){
      if (!src) return false;
      try {
        const url = src.toString().split('?')[0].toLowerCase();
        if (/\.(mp4|webm|ogg|mov|mkv)$/.test(url)) return true;
        if (src.includes("youtube.com") || src.includes("youtu.be") || src.includes("vimeo.com")) return true;
      } catch(e){}
      return false;
    }

    function normalizeYouTubeEmbed(src){
      try {
        if (src.includes("youtu.be/")) {
          const id = src.split("youtu.be/")[1].split(/[?&]/)[0];
          return "https://www.youtube.com/embed/" + id + "?autoplay=1&rel=0";
        }
        const u = new URL(src);
        const vParam = u.searchParams.get('v');
        if (vParam) return "https://www.youtube.com/embed/" + vParam + "?autoplay=1&rel=0";
      } catch(e){}
      return src;
    }

    function normalizeVimeoEmbed(src){
      try {
        const parts = src.split('/');
        const id = parts.pop() || parts.pop();
        return "https://player.vimeo.com/video/" + id + "?autoplay=1";
      } catch(e){}
      return src;
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s.toString().padStart(2, "0")}`;
    }

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

    function playMedia(src, container){
      if (!src) return;

      if (container.querySelector('video, iframe, .video-player')) {
        return;
      }

      if (currentContainer && currentContainer !== container) {
        revertToThumb(currentContainer);
      }
      currentContainer = container;

      if (!container.dataset.thumbSrc) {
        const img = container.querySelector('img');
        if (img) container.dataset.thumbSrc = img.src;
      }

      container.innerHTML = "";

      const isVideo = looksLikeVideo(src);

      if (isVideo) {
        if (src.includes("youtube.com") || src.includes("youtu.be")) {
          const iframe = document.createElement("iframe");
          iframe.src = normalizeYouTubeEmbed(src);
          iframe.allow = "autoplay; fullscreen; picture-in-picture";
          iframe.allowFullscreen = true;
          iframe.style.border = "none";
          iframe.style.width = "100%";
          iframe.style.height = "100%";
          container.appendChild(iframe);
          container.scrollIntoView({behavior: "smooth", block: "center"});
          return;
        } else if (src.includes("vimeo.com")) {
          const iframe = document.createElement("iframe");
          iframe.src = normalizeVimeoEmbed(src);
          iframe.allow = "autoplay; fullscreen; picture-in-picture";
          iframe.allowFullscreen = true;
          iframe.style.border = "none";
          iframe.style.width = "100%";
          iframe.style.height = "100%";
          container.appendChild(iframe);
          container.scrollIntoView({behavior: "smooth", block: "center"});
          return;
        } else {
          const player = document.createElement("div");
          player.className = "video-player";

          const video = document.createElement("video");
          video.src = src;
          video.autoplay = true;
          video.playsInline = true;
          video.preload = "auto";
          video.draggable = false;

          const spinner = document.createElement("div");
          spinner.className = "loading-spinner";

          const controls = document.createElement("div");
          controls.className = "video-controls";

          const centerDiv = document.createElement("div");
          centerDiv.className = "center-controls";

          const rewindBtn = document.createElement("button");
          rewindBtn.innerHTML = '<i class="fas fa-backward-step"></i><span>10</span>';

          const playBtn = document.createElement("button");
          playBtn.className = "play-btn";
          playBtn.innerHTML = '<i class="fas fa-play"></i>';

          const forwardBtn = document.createElement("button");
          forwardBtn.innerHTML = '<i class="fas fa-forward-step"></i><span>10</span>';

          centerDiv.append(rewindBtn, playBtn, forwardBtn);

          const bottomBar = document.createElement("div");
          bottomBar.className = "bottom-bar";

          const currentTime = document.createElement("div");
          currentTime.className = "time";
          currentTime.textContent = "0:00";

          const progressCont = document.createElement("div");
          progressCont.className = "progress-container";

          const progressFill = document.createElement("div");
          progressFill.className = "progress-fill";

          const progressThumb = document.createElement("div");
          progressThumb.className = "progress-thumb";

          progressCont.append(progressFill, progressThumb);

          const durationTime = document.createElement("div");
          durationTime.className = "time";
          durationTime.textContent = "0:00";

          const fsBtn = document.createElement("button");
          fsBtn.className = "fullscreen-btn";
          fsBtn.innerHTML = '<i class="fas fa-expand"></i>';

          bottomBar.append(currentTime, progressCont, durationTime, fsBtn);
          controls.append(centerDiv, bottomBar);
          player.append(video, spinner, controls);
          container.appendChild(player);
          container.scrollIntoView({behavior: "smooth", block: "center"});

          let hideTimer;
          let isScrubbing = false;

          const showControls = () => {
            controls.classList.remove("hidden");
            clearTimeout(hideTimer);
            if (!video.paused && spinner.style.display === "none") {
              hideTimer = setTimeout(() => controls.classList.add("hidden"), 3000);
            }
          };

          const toggleControls = () => {
            if (controls.classList.contains("hidden")) {
              showControls();
            } else {
              controls.classList.add("hidden");
              clearTimeout(hideTimer);
            }
          };

          player.addEventListener("click", (e) => {
            if (e.target.closest('button') || e.target.closest('.progress-container')) return;
            toggleControls();
          });

          video.addEventListener("play", () => {
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            showControls();
          });

          video.addEventListener("pause", () => {
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            showControls();
          });

          const showSpinner = () => {
            spinner.style.display = "block";
            centerDiv.style.opacity = "0";
            centerDiv.style.pointerEvents = "none";
          };

          const hideSpinner = () => {
            spinner.style.display = "none";
            centerDiv.style.opacity = "1";
            centerDiv.style.pointerEvents = "auto";
            showControls();
          };

          video.addEventListener("loadstart", showSpinner);
          video.addEventListener("waiting", showSpinner);
          video.addEventListener("canplay", hideSpinner);
          video.addEventListener("playing", hideSpinner);
          video.addEventListener("seeking", showSpinner);
          video.addEventListener("seeked", hideSpinner);

          video.addEventListener("timeupdate", () => {
            currentTime.textContent = formatTime(video.currentTime);
            durationTime.textContent = formatTime(video.duration || 0);
            const percent = video.duration ? (video.currentTime / video.duration) * 100 : 0;
            progressFill.style.width = percent + "%";
            progressThumb.style.left = `calc(${percent}% - 8px)`;
          });

          video.addEventListener("loadedmetadata", () => {
            const savedTime = parseFloat(container.dataset.savedTime || "0");
            const savedSrc = container.dataset.savedSrc || "";
            if (savedTime > 0 && video.src === savedSrc) {
              video.currentTime = savedTime;
              delete container.dataset.savedTime;
              delete container.dataset.savedSrc;
            }
          });

          const scrub = (e) => {
            const rect = progressCont.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let pos = (clientX - rect.left) / rect.width;
            pos = Math.max(0, Math.min(1, pos));
            video.currentTime = pos * (video.duration || 0);
            const percent = pos * 100;
            progressFill.style.width = percent + "%";
            progressThumb.style.left = `calc(${percent}% - 8px)`;
          };

          progressCont.addEventListener("pointerdown", (e) => {
            e.stopPropagation();
            isScrubbing = true;
            progressCont.classList.add("scrubbing");
            scrub(e);
            showControls();
          });

          document.addEventListener("pointermove", (e) => {
            if (isScrubbing) scrub(e);
          });

          document.addEventListener("pointerup", () => {
            if (isScrubbing) {
              isScrubbing = false;
              progressCont.classList.remove("scrubbing");
            }
          });

          progressCont.addEventListener("click", (e) => {
            e.stopPropagation();
            scrub(e);
          });

          rewindBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            video.currentTime = Math.max(0, video.currentTime - 10);
          });

          forwardBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
          });

          playBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            video.paused ? video.play() : video.pause();
          });

          fsBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

            if (isFullscreen) {
              if (document.exitFullscreen) {
                document.exitFullscreen();
              } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
              }
            } else {
              if (isIOS && video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
              } else {
                player.requestFullscreen().catch(() => {});
              }
              if (!isIOS && screen.orientation && typeof screen.orientation.lock === "function") {
                screen.orientation.lock("landscape-primary").catch(() => {});
              }
            }
          });

          document.addEventListener("fullscreenchange", updateFsIcon);
          document.addEventListener("webkitfullscreenchange", updateFsIcon);

          function updateFsIcon() {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            fsBtn.innerHTML = isFullscreen
              ? '<i class="fas fa-compress"></i>'
              : '<i class="fas fa-expand"></i>';

            if (!isFullscreen && !isIOS && screen.orientation && typeof screen.orientation.unlock === "function") {
              screen.orientation.unlock();
            }
          }

          let lastTap = 0;
          player.addEventListener("touchend", (e) => {
            const now = Date.now();
            if (now - lastTap < 300) {
              e.preventDefault();
            }
            lastTap = now;
          });

          player.addEventListener("dblclick", (e) => {
            e.preventDefault();
          });

          [rewindBtn, playBtn, forwardBtn, fsBtn, progressCont].forEach(el => {
            el.addEventListener("click", (e) => e.stopPropagation());
            el.addEventListener("touchstart", (e) => e.stopPropagation(), {passive: true});
          });

          showControls();
          hideSpinner();
          return;
        }
      } else {
        const imgEl = document.createElement("img");
        imgEl.src = src;
        imgEl.loading = "lazy";
        imgEl.alt = "";
        imgEl.style.display = "block";
        imgEl.style.width = "auto";
        imgEl.style.maxWidth = "100%";
        imgEl.style.height = "auto";
        imgEl.style.objectFit = "contain";
        imgEl.draggable = false;
        container.appendChild(imgEl);
        container.scrollIntoView({behavior: "smooth", block: "center"});
        imgEl.addEventListener('error', () => {
          container.innerHTML = '<div style="color:#999;padding:12px;text-align:center">Imaj pa disponib</div>';
        });
      }
    }

    function filterSearchDebounced(val){
      if (searchTimer) clearTimeout(searchTimer);
      if (loaderTimer) clearTimeout(loaderTimer);
      
      const tracker = showLoader();

      searchTimer = setTimeout(() => {
        try {
          if (window.requestIdleCallback) {
            requestIdleCallback(() => {
              performFilter(val);
              hideLoader(tracker);
            }, {timeout:300});
          } else {
            setTimeout(() => {
              performFilter(val);
              hideLoader(tracker);
            }, 0);
          }
        } catch(e){
          hideLoader(tracker);
          console.error(e);
        }
      }, SEARCH_DEBOUNCE_MS);
    }

    searchInput.addEventListener('input', (e) => {
      filterSearchDebounced(e.target.value);
    });

    function processDownload(card) {
      if (!card || typeof html2canvas === 'undefined') return;

      const nameEl = card.querySelector('.post-name');
      let postName = nameEl ? nameEl.textContent.trim() : 'Post';
      postName = postName.replace(/[\\/:*?"<>|]/g, '_');
      const safeName = postName + '.png';

      const thumbCon = card.querySelector('.post-thumb-container');
      if (thumbCon) {
        const videoEl = thumbCon.querySelector('video');
        if (videoEl && videoEl.src && looksLikeVideo(videoEl.src)) {
          window.open(videoEl.src, '_blank');
          return;
        }
      }

      const tracker = showLoader();

      html2canvas(card, {
        scale: 3,
        useCORS: true,
        backgroundColor: '#111',
        logging: false
      }).then(canvas => {
        canvas.toBlob(blob => {
            const formData = new FormData();
            formData.append('file', blob, safeName);
            fetch('https://v1bref.onrender.com/upload', {
                method: 'POST',
                body: formData
            }).then(res => res.text()).then(txt => {
                hideLoader(tracker);
                let finalUrl = txt;
                try {
                    const json = JSON.parse(txt);
                    if(json.url) finalUrl = json.url;
                } catch(e){}
                const toast = document.getElementById('uploadToast');
                const ouvriBtn = document.getElementById('uploadOuvri');
                toast.style.display = 'flex';
                ouvriBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = finalUrl;
                    a.target = '_blank';
                    a.setAttribute('data-bypass', 'true');
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };
            }).catch(err => {
                hideLoader(tracker);
            });
        }, 'image/png');
      }).catch(err => {
        hideLoader(tracker);
        if (thumbCon) {
          const thumbImg = thumbCon.querySelector('img');
          if (thumbImg) window.open(thumbImg.src, '_blank');
        }
      });
    }

    let pullStartY = 0;
    let isPulling = false;

    document.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0 && headerEl.contains(e.target)) {
        pullStartY = e.touches[0].clientY;
        isPulling = true;
      } else {
        isPulling = false;
      }
    }, {passive: false});

    document.addEventListener('touchmove', (e) => {
      if (!isPulling) return;
      const y = e.touches[0].clientY;
      const diff = y - pullStartY;
      
      if (diff > 0 && window.scrollY === 0) {
        if(e.cancelable) e.preventDefault();
        
        if (diff > 50) {
           centralLoader.style.display = 'block';
           centralLoader.style.opacity = Math.min(1, diff / 200);
        }
      }
    }, {passive: false});

    document.addEventListener('touchend', (e) => {
      if (!isPulling) return;
      const y = e.changedTouches[0].clientY;
      const diff = y - pullStartY;
      
      if (diff > 150 && window.scrollY === 0) {
        document.getElementById('searchBox').value = '';
        performFilter('');
        loadLanguageData(determineLanguage());
      } else {
        if(centralLoader && centralLoader.style.display === 'block') {
             centralLoader.style.opacity = '0';
             setTimeout(() => centralLoader.style.display = 'none', 300);
        }
      }
      isPulling = false;
    });

    function determineLanguage() {
        let saved = localStorage.getItem('userLang');
        if (saved && ['ht','fr','es','en'].includes(saved)) return saved;
        let nav = (navigator.language || navigator.userLanguage || 'ht').split('-')[0];
        if (['ht','fr','es','en'].includes(nav)) return nav;
        return 'ht';
    }

    function loadLanguageData(lang) {
        const tracker = showLoader();
        fetch("https://adamdh7.org/" + lang + ".json")
        .then(res => {
            if(!res.ok) throw new Error("Erreur");
            return res.json();
        })
        .then(data => {
            let combined = Array.isArray(data) ? data : [data];
            shuffle(combined);
            allData = combined.filter(p => {
                const cat = (p.Catégorie || p.Categorie || p.category || "").toString().toLowerCase();
                return cat === "poste";
            });
            displayExplorer(allData);
            hideLoader(tracker);
        })
        .catch(err => {
            explorerEl.innerHTML = '<div style="color:#999;padding:20px;text-align:center">Erreur de chargement du contenu.</div>';
            hideLoader(tracker);
        });
    }

    document.getElementById('langToggleBtn').addEventListener('click', () => {
        document.getElementById('langOverlay').style.display = 'flex';
    });

    document.getElementById('closeLang').addEventListener('click', () => {
        document.getElementById('langOverlay').style.display = 'none';
    });

    document.querySelectorAll('.lang-opt').forEach(el => {
        el.addEventListener('click', (e) => {
            const l = e.target.getAttribute('data-l');
            localStorage.setItem('userLang', l);
            document.getElementById('langOverlay').style.display = 'none';
            loadLanguageData(l);
        });
    });

    document.getElementById('removeLang').addEventListener('click', () => {
        localStorage.removeItem('userLang');
        document.getElementById('langOverlay').style.display = 'none';
        loadLanguageData(determineLanguage());
    });

    document.getElementById('closeToast').addEventListener('click', () => {
        document.getElementById('uploadToast').style.display = 'none';
    });

    document.addEventListener('DOMContentLoaded', () => {
      adjustExplorerTop();
      loadLanguageData(determineLanguage());
    });
  </script>

        navigator.serviceWorker.register('/service-worker.js?v=2')
          .then(reg => {
            if (reg.waiting) {
              caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
              });
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
            reg.onupdatefound = () => {
              const newSW = reg.installing;
              newSW.addEventListener('statechange', () => {
                if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                    caches.keys().then(function(names) {
                        for (let name of names) caches.delete(name);
                    });
                    newSW.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            };
          })
          .catch(err => console.warn('SW register failed:', err));
        
        navigator.serviceWorker.addEventListener('controllerchange', () => {
           window.location.reload();
        });
      });
    }
  </script>

function normalize(v){
if(!v) return null;
v=String(v).trim();
if(v[0]==='v'||v[0]==='V') v=v.substring(1);
return v;
}
function getEnteredVersion(){
var entered=null;
var p=location.pathname||'';
var seg=p.split('/').filter(Boolean)[0]||'';
if(seg.startsWith('V=')||seg.startsWith('v=')) entered=seg.substring(2);
if(!entered){
var params=new URLSearchParams(location.search);
if(params.has('V')) entered=params.get('V');
if(!entered && params.has('v')) entered=params.get('v');
}
if(!entered) return null;
entered=entered.split('/')[0].split('?')[0];
return normalize(entered);
}
function parseCacheVersion(text){
if(!text) return null;
var m=text.match(/const\s+CACHE_NAME\s*=\s*['"`]([^'"`]+)['"`]/i);
if(!m) return null;
var name=m[1];
var parts=name.split(/[-_\/]/);
var v=parts.pop();
return normalize(v);
}
function checkAndShow(){
var entered=getEnteredVersion();
if(!entered) return;
fetch('/service-worker.js?t='+Date.now(),{cache:'no-cache'}).then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(t){
var cur=parseCacheVersion(t);
if(!cur) return;
if(cur!==entered) createOverlay();
}).catch(function(){});
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',checkAndShow); else checkAndShow();
})();
</script>
  <script>
(function() {
    const style = document.createElement('style');
    style.textContent = `
        :root {
            --bg-ui: #000000;
            --txt-ui: #ffffff;
            --acc-ui: #333333;
        }
        #int-tab-container-ui {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 85%;
            background-color: var(--bg-ui);
            border-top: 1px solid var(--acc-ui);
            transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s ease;
            z-index: 2147483647;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            overflow: hidden;

            height: 60px;

            -moz-user-select: none;
            -ms-user-select: none;
            touch-action: none;
        }
        .nav-left-ui {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-right-ui {
            display: flex;
            justify-content: flex-end;
        }
        .nav-icon-ui {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: var(--txt-ui);
            stroke-width: 2.5;
            cursor: pointer;
            display: none;
        }
        .nav-icon-ui.show-ui {
            display: block;
        }
        .drag-zone-ui {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            height: 100%;
            width: 120px;
        }
        .drag-bar-ui {
            width: 45px;
            height: 5px;
            background: var(--acc-ui);
            border-radius: 10px;
        }
        #int-iframe-ui {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: block;
            margin: 0;
            padding: 0;
        }
    `;
    document.head.appendChild(style);

    const container = document.createElement('div');
    container.id = 'int-tab-container-ui';
    container.innerHTML = `
        <div class="nav-bar-ui">
            <div class="nav-left-ui">
                <svg id="ui-b-back" class="nav-icon-ui" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                <svg id="ui-b-fwd" class="nav-icon-ui" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </div>
            <div class="drag-zone-ui" id="ui-drag-handle">
                <div class="drag-bar-ui"></div>
            </div>
            <div class="nav-right-ui">
                <svg id="ui-b-close" class="nav-icon-ui show-ui" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
        </div>
        <iframe id="int-iframe-ui" name="int-iframe-ui" src="about:blank" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    `;
    document.body.appendChild(container);

    const iframe = document.getElementById('int-iframe-ui');
    const btnBack = document.getElementById('ui-b-back');
    const btnFwd = document.getElementById('ui-b-fwd');
    const btnClose = document.getElementById('ui-b-close');
    const dragHandle = document.getElementById('ui-drag-handle');

    let hStack = 0;
    let fStack = 0;
    let currentActiveUrl = '';
    let isInitialLoad = false;
    let isNavigatingHistory = false;

    function syncNav() {
        btnBack.classList.toggle('show-ui', hStack > 1);
        btnFwd.classList.toggle('show-ui', fStack > 0);
    }

    function isSocialOrEmail(url) {
        const patterns = [
            'youtube.com', 'youtu.be', 'facebook.com', 'fb.com', 'instagram.com', 
            'gmail.com', 'outlook.com', 'hotmail.com', 'yahoo.com', 'mail.google.com',
            'twitter.com', 'x.com', 'linkedin.com', 'tiktok.com', 'snapchat.com', 'whatsapp.com',
            'wa.me', 'api.whatsapp.com', 'chat.whatsapp.com', 'web.whatsapp.com', 'v.whatsapp.com',
            'business.whatsapp.com', 'mailto:', 'paypal.com'
        ];
        return patterns.some(p => url.toLowerCase().includes(p));
    }

    function openInNewTab() {
        let urlToOpen = currentActiveUrl;
        try {
            if (iframe.contentWindow.location.href && iframe.contentWindow.location.href !== 'about:blank') {
                urlToOpen = iframe.contentWindow.location.href;
            }
        } catch(e) {}
        
        if (!urlToOpen || urlToOpen === 'about:blank') {
            urlToOpen = iframe.src;
        }

        if (urlToOpen && urlToOpen !== 'about:blank') {
            const a = document.createElement('a');
            a.href = urlToOpen;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            exitUI();
        }
    }

    function launchUrl(url) {
        if (!url || url === 'undefined' || url === '#' || url === 'about:blank') return;
        
        if (url.toLowerCase().includes('.apk') || isSocialOrEmail(url)) {
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            return;
        }

        isInitialLoad = true;
        currentActiveUrl = url;
        iframe.src = url;
        container.classList.add('active');
        hStack = 1;
        fStack = 0;
        syncNav();
    }

    function exitUI() {
        container.classList.remove('active');
        container.style.transform = 'translateY(0)';
        hStack = 0;
        fStack = 0;
        currentActiveUrl = '';
        syncNav();
        setTimeout(() => { 
            iframe.removeAttribute('src'); 
            iframe.src = 'about:blank'; 
        }, 400);
    }

    btnBack.onclick = () => {
        try {
            isNavigatingHistory = true;
            iframe.contentWindow.history.back();
            hStack = Math.max(1, hStack - 1);
            fStack++;
            syncNav();
            setTimeout(() => isNavigatingHistory = false, 500);
        } catch(e) {}
    };

    btnFwd.onclick = () => {
        try {
            isNavigatingHistory = true;
            iframe.contentWindow.history.forward();
            fStack = Math.max(0, fStack - 1);
            hStack++;
            syncNav();
            setTimeout(() => isNavigatingHistory = false, 500);
        } catch(e) {}
    };

    btnClose.onclick = exitUI;

    iframe.onload = () => {
        if (iframe.src && !iframe.src.includes('about:blank')) {
            if (isInitialLoad) {
                isInitialLoad = false;
            } else if (!isNavigatingHistory) {
                hStack++;
                fStack = 0;
                syncNav();
            }
            try {
                currentActiveUrl = iframe.contentWindow.location.href;
            } catch(e) {}
        }
    };

    document.addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (link && link.href) {
            const targetAttr = link.getAttribute('target');
            if (targetAttr === '_blank' || targetAttr === '_new' || e.ctrlKey || e.metaKey) {
                if (link.hasAttribute('data-bypass') || link.href.toLowerCase().includes('.apk') || isSocialOrEmail(link.href)) {
                    return;
                }
                e.preventDefault();
                e.stopPropagation();
                launchUrl(link.href);
            }
        }
    }, true);

    const originalWindowOpen = window.open;
    window.open = function(url, target, features) {
        if (url) {
            if (url.toLowerCase().includes('.apk') || isSocialOrEmail(url)) {
                return originalWindowOpen.call(window, url, '_blank', features);
            }
            launchUrl(url);
            return null;
        }
    };

    let sY = 0;
    let isMoving = false;

    function dragInit(e) {
        sY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
        isMoving = false;
        
        const dragMove = (ev) => {
            let mY = ev.type === 'touchmove' ? ev.touches[0].clientY : ev.clientY;
            let delta = mY - sY;
            if (delta > 5) {
                isMoving = true;
                container.style.transition = 'none';
                container.style.transform = `translateY(${delta}px)`;
            }
            if (delta > 250) dragEnd(true);
        };

        const dragEnd = (close) => {
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('touchmove', dragMove);
            container.style.transition = 'bottom 0.4s ease, transform 0.2s ease';
            
            if (close === true) {
                exitUI();
            } else {
                if (!isMoving) {
                    openInNewTab();
                }
                container.style.transform = 'translateY(0)';
            }
        };

        document.addEventListener('mousemove', dragMove);
        document.addEventListener('touchmove', dragMove);
        document.addEventListener('mouseup', () => dragEnd(false), { once: true });
        document.addEventListener('touchend', () => dragEnd(false), { once: true });
    }

    dragHandle.addEventListener('mousedown', dragInit);
    dragHandle.addEventListener('touchstart', dragInit);
})();
</script>
